# Shared native kernel-install policy; apply before installing either kernel.
# Reuse the common direct-EFI layout; custom drop-ins disable external generation.
L+ /etc/kernel/custom/install.conf - - - - ../install.conf
# Source eclass signing and packaged fallback signatures own EFI trust.
# sbctl's hook supports BLS/UKI paths, not our direct-EFI layout.
L+ /etc/kernel/install.d/91-sbctl.install - - - - /dev/null
