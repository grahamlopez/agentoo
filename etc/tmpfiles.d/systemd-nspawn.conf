# Agentoo storage policy: keep unused feature directories inside the root snapshot.
# Nested Btrfs subvolumes are excluded from a snapshot of their parent. Reintroducing
# them would break the intended simplified checkpoint/restore assumption of only @ and @home.
# Keep these d rules even if machine/portable services are later unmasked.
# If a feature needs subvolumes, redesign and test checkpoint coverage before enabling
# that behavior. Review vendor changes to this same-named override during upgrades.
# Based on systemd 261; unrelated vendor rules below are retained.
#
#  This file is part of systemd.
#
#  systemd is free software; you can redistribute it and/or modify it
#  under the terms of the GNU Lesser General Public License as published by
#  the Free Software Foundation; either version 2.1 of the License, or
#  (at your option) any later version.

# See tmpfiles.d(5) for details.

d /var/lib/machines 0700 - - -

# Remove old temporary snapshots, but only at boot. Ideally we'd have
# "self-destroying" btrfs snapshots that go away if the last
# reference to it does. To mimic a scheme like this at least remove
# the old snapshots on fresh boots, where we know they cannot be
# referenced anymore. Note that we actually remove all temporary files
# in /var/lib/machines/ at boot, which should be safe since the
# directory has defined semantics. In the root directory (where
# systemd-nspawn --ephemeral places snapshots) we are more strict, to
# avoid removing unrelated temporary files.

R! /var/lib/machines/.#*
R! /.#machine.*

# If the nsresourced/mountfsd sockets are mounted into /run/host, symlink them to their canonical
# location in /run/systemd.
L? /run/systemd/io.systemd.NamespaceResource - - - - /run/host/io.systemd.NamespaceResource
L? /run/systemd/io.systemd.MountFileSystem   - - - - /run/host/io.systemd.MountFileSystem
