# Dracut sources all fragments; the filename alone does not select this host.
if [[ -r /etc/agentoo/target-host ]]; then
    . /etc/agentoo/target-host
    if [[ ${GENTOO_TARGET_HOST:-} == startop ]]; then
        # Finish graphics initialization before tty1 autologin launches Hyprland.
        force_drivers+=" i915 "
    fi
fi
