# Dracut sources every fragment; select through the native Portage profile.
agentoo_host=$(python3 /usr/local/share/agentoo/lib/host_selection.py) || return 1
if [[ $agentoo_host == startop ]]; then
    # Finish graphics initialization before tty1 autologin launches Hyprland.
    force_drivers+=" i915 "
fi
unset agentoo_host
