# Broad distribution fallback; custom images use their own generation workflow.
hostonly="no"
hostonly_cmdline="no"
uefi="no"
# Firmware packages use -initramfs; override their disabled generator defaults.
early_microcode="yes"
add_dracutmodules+=" crypt btrfs "
add_drivers+=" nvme ahci virtio_pci virtio_blk virtio_scsi usbhid hid_generic xhci_pci atkbd i8042 "
