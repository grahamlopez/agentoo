# Agentoo checkpoints capture @ and @home, not arbitrary nested subvolumes.
# Keep imported images as ordinary directories so their data stays in root snapshots.
# Retain this policy if importd is installed/unmasked in the future. Changing it
# requires designing and testing additional checkpoint boundaries first.
# Direct import commands must also use --btrfs-subvol=no --btrfs-quota=no.
# Explicit cloning/ephemeral-container operations may still create subvolumes;
# these settings are importer defaults, not a filesystem-wide prohibition.
[Service]
Environment=SYSTEMD_IMPORT_BTRFS_SUBVOL=0
Environment=SYSTEMD_IMPORT_BTRFS_QUOTA=0
