# Available for explicit emerge --getbinpkg use; source builds remain default.
[gentoobinhost]
priority = 9999
# Keep downloaded binaries inside the cache handled by checkpoint cleanup.
location = /var/cache/binpkgs/gentoobinhost
sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
verify-signature = true
