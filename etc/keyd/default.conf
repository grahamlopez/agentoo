# /etc/keyd/default.conf
[ids]

*

[main]

# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# Remaps the escape key to capslock
# esc = capslock

# Hold left alt for navigation, matching the Lily58 ZMK Up-1 layer:
# hjkl = arrows; nm,. = Home, Page Down, Page Up, End.
# Other keys pass through for normal alt+ keybindings.
leftalt = layer(nav)

[nav:A]
h = left
j = down
k = up
l = right
n = home
m = pagedown
comma = pageup
dot = end
