# Agentoo tmux defaults, adapted from dots/.tmux.conf.
# ~/.tmux.conf loads afterward for local overrides.
#
# https://github.com/tmux/tmux/wiki
# use tmux kill-server to clear global variables when changing config
#
set -g prefix ^A

# avoid vim mode switching delay
set -s escape-time 0
# number of lines to keep in the history
set -g history-limit 10000
# set time for which status line messages are displayed in ms
set -g display-time 2000
# set time for which pane selections are displayed in ms
set -g display-panes-time 2000
# update the status bar every interval seconds
set -g status-interval 15
# watch windows for activity, and report it in the status line rather than
# as a bell. monitor-activity turns the watching on; visual-activity only
# chooses how the alert is shown, so it does nothing on its own.
# How the flagged window is drawn is set with the other window-status styles
# down in Appearance.
set -g monitor-activity on
set -g visual-activity on

# asked for by neovim :checkhealth
set -g focus-events on
# keybinding mode for tmux command prompt
set -g status-keys emacs
# keybinding mode for tmux copy mode
set -g mode-keys vi

# TERM stuff
#set -g default-terminal "${TERM}"
# interferes with f-person/auto-dark-mode.nvim, so it stays off. Note that this
# does NOT leave tmux inheriting TERM from the emulator: with default-terminal
# unset tmux uses its own built-in default, which panes then see as $TERM
# (tmux-256color here - confirm with `tmux show -gv default-terminal`).
# A host lacking that terminfo entry is not fatal, tmux still starts, but
# programs inside it fall back to dumber capabilities. The entry that must
# exist is the *outer* one: a tmux client refuses to attach at all when the
# emulator's TERM is unknown to the host ("missing or unsuitable terminal"),
# which is what the TERM guard in .zshrc handles on fresh VMs.
#set -g default-terminal "screen-256color"
# Two mechanisms are in play here, deliberately:
#   terminal-features  - newer, declarative: "this terminal supports X"
#   terminal-overrides - older, patches terminfo capabilities directly
# Both use `set -as` (append), so entries accumulate rather than replace, and
# a second `set -as terminal-features` appears further down under the
# extended-keys settings. Tc and RGB both mean truecolor, via the two routes.
set -as terminal-features 'xterm-kitty:RGB'
# true color for xterm/alacritty, undercurl support, underscore colors (needs tmux 3.0+)
# NOTE: tmux >=3.2 has a 'usstyle' feature covering underscore style/colour,
# which may make the Smulx/Setulc half of this redundant - untested, left alone.
set -as terminal-overrides ",xterm*:Tc,alacritt*:Tc,*:Smulx=\E[4::%p1%dm,*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# keys

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# join-pane shortcut
bind-key @ command-prompt -p "create pane from:"  "join-pane -hs ':%%'"

# quickly get to last pane
unbind ^A
bind ^A last-pane

#to get readline shortcut
bind a send-prefix

# this messes with system selection
#set -g mouse on

# arrow keys for pane navigation (no repeat)
bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R
# to be a little vim-like getting around panes ("windows" in vim)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
# (J and K are bound below to move-pane; swap-pane bindings on the same keys
# were silently overridden and have been removed)

# experimental: trying to have more explicit pane placement (force to edge)
bind-key H move-pane -s . -h -b -t '{left}'
bind-key L move-pane -s . -h    -t '{right}'
bind-key K move-pane -s . -v -b -t '{top}'
bind-key J move-pane -s . -v    -t '{bottom}'

bind-key -r - resize-pane -D 5
bind-key -r + resize-pane -U 5
bind-key -r < resize-pane -L 5
bind-key -r > resize-pane -R 5

# Open new windows and panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# proposed removal: Agent-specific extended-key settings are deferred until the agent tools are installed.
# # Amp CLI compatibility settings.
# # These two are a pair: extended-keys turns the feature on, and the
# # terminal-features entry declares that xterm-alikes can carry it. This is the
# # second `set -as terminal-features` - it appends to the one in the TERM block
# # above rather than replacing it, so both entries are live.
# set -s extended-keys on
# set -as terminal-features 'xterm*:extkeys'
# # pi.dev harness settings
# set -g extended-keys-format csi-u
# bind -n C-Enter send-keys Enter
# 
# 
# Appearance

# unset inherited styles so source-file reloads cleanly
set -gu window-style
set -gu window-active-style
set -gu pane-border-style
set -gu pane-active-border-style

# Borders only, no dimming of pane contents
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=blue,bold'
set -g pane-border-lines heavy

# No window styles touching fg/bg, so shell/editor colors are untouched
set -g window-style default
set -g window-active-style default

# set right status bar blank (until better use for it found)
set -g status-right ""

set -g pane-border-status bottom
set -g pane-border-format '#[align=right] #P ━━━'

# default statusbar colors
set -g status-fg default
set -g status-bg default
set -g status-style default

# default window title colors
set-window-option -g window-status-style fg=default,bg=default,dim
# # active window title colors
set-window-option -g window-status-current-style fg=blue,bg=default,bright

# Activity marker. tmux's default window-status-activity-style is `reverse`,
# which swaps fg/bg on the whole window name - a solid block that fights the
# transparent status bar and is hard to read. Colour the name instead, and
# hang a dot off the end so the flag is visible without relying on colour.
# The format's else-branch is tmux's stock `#{?window_flags,#{window_flags}, }`,
# so bell/zoom/marked flags still render exactly as they did.
set-window-option -g window-status-activity-style fg=yellow
set-window-option -g window-status-format '#I:#W#{?window_activity_flag,#[fg=yellow]•#[default],#{?window_flags,#{window_flags}, }}'
# # command/message line colors
set -g message-style fg=default,bg=default,bright

# some default dimensions
set -g main-pane-width 90
bind-key m select-layout main-vertical
