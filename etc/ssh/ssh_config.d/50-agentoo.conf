# Agentoo outbound (user) SSH defaults; this does not configure incoming SSH access.
# proposed removal: Machine-specific Brev path; keep service/host definitions local.
# Include "/home/glopez/.brev/ssh_config"
# ~/.ssh/config - tracked in the dotfiles repo (dgit).
#
# Machine-local host definitions go in ~/.ssh/config.d/*.conf, which is
# NOT tracked. Keep work hostnames, jump hosts, etc. there.
#
# Include must stay ABOVE the "Host *" block: ssh takes the first value it
# obtains for most keywords, and IdentityFile accumulates in order. With the
# include first, a host-specific key is offered before the default one.

# System Includes require %d for the invoking account’s home directory.
Include %d/.ssh/config.d/*.conf

Host *
    # Load the key into the agent on first use, then reuse it for 4 hours,
    # after which the agent drops it and the next connection prompts again.
    # A bare interval is a valid argument here (see TIME FORMATS in
    # sshd_config(5)); `yes` would cache until the agent exits. Verify how a
    # value parsed with: ssh -G <host> | grep addkeystoagent  (4h -> 14400).
    #
    # To force a per-connection passphrase prompt for one host, opt out in
    # its config.d block (it wins, being included above this):
    #     Host secure.example
    #         IdentityFile ~/.ssh/id_other
    #         IdentitiesOnly yes   # don't let the agent offer the key below
    #         AddKeysToAgent no    # never cache -> prompt every time
    AddKeysToAgent 4h
    IdentityFile ~/.ssh/id_ed25519
