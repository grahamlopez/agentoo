# Flattop provisioning profile. References only; never put secret values here.
# Create a Proton Pass item named flattop-secureboot in the agentoo vault.
# Add the following seven text fields, each containing the complete contents
# of the corresponding destination file below (including PEM header/footer
# lines and line breaks). GUID contains the existing sbctl owner UUID.
# Field names: PK.key, PK.pem, KEK.key, KEK.pem, db.key, db.pem, GUID.
# These must all come from the same existing Flattop sbctl setup.
#
# Columns:
# category  owner  destination                     method  source
secureboot  root   /var/lib/sbctl/keys/PK/PK.key   field   pass://agentoo/flattop-secureboot/PK.key
secureboot  root   /var/lib/sbctl/keys/PK/PK.pem   field   pass://agentoo/flattop-secureboot/PK.pem
secureboot  root   /var/lib/sbctl/keys/KEK/KEK.key field   pass://agentoo/flattop-secureboot/KEK.key
secureboot  root   /var/lib/sbctl/keys/KEK/KEK.pem field   pass://agentoo/flattop-secureboot/KEK.pem
secureboot  root   /var/lib/sbctl/keys/db/db.key   field   pass://agentoo/flattop-secureboot/db.key
secureboot  root   /var/lib/sbctl/keys/db/db.pem   field   pass://agentoo/flattop-secureboot/db.pem
secureboot  root   /var/lib/sbctl/GUID             field   pass://agentoo/flattop-secureboot/GUID
