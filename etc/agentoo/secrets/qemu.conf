# QEMU provisioning profile. No secret values are stored in this file.
# Columns: category owner destination method source
github root /var/lib/agentoo/secrets/github.credentials github pass://agentoo/qemu-agentoo-github-token
ssh user HOME/.ssh/id_ed25519 field pass://agentoo/qemu-graham-ssh-keypair/private key
ssh user HOME/.ssh/id_ed25519.pub field pass://agentoo/qemu-graham-ssh-keypair/public key
pi user HOME/.pi/agent/auth.json field pass://agentoo/pi-auth-json/note
# File-installation test only: QEMU uses Ethernet, not wlan0 Wi-Fi.
# The note contains a complete native configuration; no service is started.
wifi root /etc/wpa_supplicant/wpa_supplicant-wlan0.conf field pass://agentoo/qemu-wpa-supplicant/note
