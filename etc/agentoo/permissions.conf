# Recursive rules cover Git-tracked files and their parent directories.
# Rule order does not matter: exact rules override the closest tree.
# Paths are relative to the target root; owners are numeric UID/GID.

tree etc/ 0 0 0644 0755
tree usr/local/share/agentoo/ 0 0 0644 0755
tree usr/local/share/agentoo/git-hooks/ 0 0 0755 0755
tree usr/local/bin/ 0 0 0755 0755
tree usr/local/share/nvim/ 0 0 0644 0755
tree usr/share/keymaps/ 0 0 0644 0755
tree root/ 0 0 0700 0700
tree boot/agentoo/ 0 0 0700 0700
tree etc/kernel/install.d/ 0 0 0755 0755

# Exceptions to tree defaults.
file README.md 0 0 0644
file .gitignore 0 0 0644
file etc/sudoers.d/90-agentoo-graham 0 0 0440
file usr/local/share/agentoo/installer/gentoo-install.sh 0 0 0755
