# Syntax (all supported rule types):
#   tree PATH UID GID FILE_MODE DIR_MODE
#   file PATH UID GID MODE
#   dir  PATH UID GID MODE
#
# tree: manages its root, Git-tracked files beneath it, and their parent
#       directories within the tree. Untracked contents remain untouched.
# file: manages one regular file, even if untracked; overrides tree defaults.
# dir:  manages only that directory, with no inheritance to its contents;
#       overrides the directory mode from a tree rule at the same path.
# Example of a directory-only exception (not active):
#   dir etc/agentoo/secrets/ 0 0 0700
#
# Order never matters: exact file/dir rules win, otherwise the closest tree wins.
# A tree and dir may share a path; duplicate rules of the same type and file
# rules conflicting with tree/dir rules at the same path are rejected.
# Paths are relative to the target root: no leading /, .., or symlinks.
# A trailing / is optional for tree/dir; wildcards are not supported.
# UID/GID must be numeric; modes are four octal digits without special bits.
# Tree roots and exact paths must exist; every tracked file must be covered.
# Blank lines and full-line comments are allowed; inline comments are not.
# Details: usr/local/share/agentoo/docs/permissions.md

tree etc/ 0 0 0644 0755
tree usr/local/share/agentoo/ 0 0 0644 0755
tree usr/local/share/agentoo/git-hooks/ 0 0 0755 0755
tree usr/local/bin/ 0 0 0755 0755
tree usr/local/share/nvim/ 0 0 0644 0755
tree usr/share/keymaps/ 0 0 0644 0755
tree root/ 0 0 0700 0700
# EFI FAT modes match fmask=0133,dmask=0022; scripts run through sh.
tree boot/agentoo/ 0 0 0644 0755
tree etc/kernel/install.d/ 0 0 0755 0755

# Exceptions to tree defaults.
file README.md 0 0 0644
file .gitignore 0 0 0644
file etc/sudoers.d/90-agentoo-graham 0 0 0440
file usr/local/share/agentoo/installer/gentoo-install.sh 0 0 0755
file usr/local/share/agentoo/lib/kitty/host_config.py 0 0 0755
file usr/local/share/agentoo/initramfs/build 0 0 0755
file usr/local/share/agentoo/initramfs/smoke 0 0 0755
