# Optional image/container managers are unused in the initial Agentoo system.
# Installer applies these persistent masks before package configuration can activate
# them. Aliases and the machined socket are included to cover on-demand activation.
# Unmasking a feature does NOT revoke /etc/tmpfiles.d ordinary-directory policy.
# Before enabling image/container operations, check that they do not create nested
# subvolumes: those are absent from parent snapshots and break simple root/home
# checkpoint coverage. Explicit snapshot/clone operations need a separate decision.
# Keep shared infrastructure (machine.slice, machines.target, virtualization support).
systemd-machined.service
systemd-machined.socket
dbus-org.freedesktop.machine1.service
systemd-portabled.service
dbus-org.freedesktop.portable1.service
systemd-importd.service
systemd-nspawn@.service
