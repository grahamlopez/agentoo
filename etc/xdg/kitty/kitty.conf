# Kitty loads system defaults before user configuration.
# Silence terminal bells from applications, including those running through tmux.
enable_audio_bell no

geninclude /usr/local/share/agentoo/lib/kitty/host_config.py

# Let Hyprland size new terminals instead of restoring a maximized state.
remember_window_size no

# Native background transparency, without external remote-control access.
dynamic_background_opacity yes
watcher /usr/local/share/agentoo/lib/kitty/transparency.py
