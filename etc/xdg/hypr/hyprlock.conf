# Opaque on every output, with no fade that could expose the desktop on wake.
animations {
    enabled = false
}

background {
    monitor =
    color = rgb(111111)
}

input-field {
    monitor =
    size = 300, 60
    position = 0, 0
    halign = center
    valign = center
    rounding = 0
    inner_color = rgb(222222)
    outer_color = rgb(777777)
    font_color = rgb(eeeeee)
    fade_on_empty = false
    placeholder_text = auth
}
